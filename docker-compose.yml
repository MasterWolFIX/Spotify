services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: music_php
    restart: unless-stopped
    volumes:
      - .:/var/www/app
      - vendor_data:/var/www/app/vendor
      - var_data:/var/www/app/var
      - ${MUSIC_DIR_HOST:-./music}:/var/lib/music:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MUSIC_DIR: /var/lib/music
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - music_net

  nginx:
    image: nginx:stable-alpine
    container_name: music_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/app:ro
      - vendor_data:/var/www/app/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - music_net

  mariadb:
    image: mariadb:11
    container_name: music_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-music_player}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app_secret}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - music_net

  adminer:
    image: adminer:latest
    container_name: music_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - music_net
    profiles:
      - dev

networks:
  music_net:
    driver: bridge

volumes:
  db_data:
  vendor_data:
  var_data:
